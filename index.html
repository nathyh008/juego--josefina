<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Misión 6.º</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#75d5ff,#9d8cff,#ff9fca);
 min-height:100vh;
 padding:15px;
 color:#35355c;
}

.container{
 max-width:950px;
 margin:auto;
 background:white;
 border-radius:30px;
 padding:22px;
 box-shadow:0 15px 45px #403b7a55;
}

header{text-align:center}

.badge{
 display:inline-block;
 background:linear-gradient(90deg,#ff579b,#655de8);
 color:white;
 padding:7px 18px;
 border-radius:20px;
 font-weight:bold;
}

h1{
 margin:8px 0 3px;
 font-size:clamp(34px,7vw,55px);
 background:linear-gradient(90deg,#ff4d91,#685ce8,#00aeea);
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{margin-top:5px;font-size:17px}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:20px 0;
}

.stat{
 padding:10px;
 border-radius:18px;
 text-align:center;
 font-weight:bold;
}

.stat b{
 display:block;
 font-size:25px;
 margin-top:3px;
}

.points{background:#fff0a8}
.time{background:#c7f3ff}
.lives{background:#ffd1e1}
.level{background:#d8ffd2}

.game{
 display:grid;
 grid-template-columns:minmax(0,1fr) 280px;
 gap:22px;
}

.board{
 background:#6960dc;
 padding:7px;
 border-radius:20px;
}

#grid{
 display:grid;
 grid-template-columns:repeat(12,1fr);
 gap:3px;
}

.cell{
 aspect-ratio:1;
 background:white;
 border-radius:6px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:clamp(12px,3vw,22px);
 cursor:pointer;
 transition:.15s;
}

.cell:hover{background:#fff0a6}

.cell.selected{
 background:#ffc94f;
 transform:scale(1.05);
}

.cell.found{
 background:#54d5a3;
 color:white;
}

.panel{
 background:#f4f3ff;
 border-radius:22px;
 padding:18px;
}

.panel h2{
 margin-top:0;
 color:#5f55d6;
}

.levelTitle{
 background:#6960dc;
 color:white;
 padding:10px;
 border-radius:15px;
 text-align:center;
 font-weight:bold;
 margin-bottom:12px;
}

.words{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
}

.word{
 background:white;
 padding:6px 9px;
 border-radius:13px;
 font-size:13px;
 font-weight:bold;
 box-shadow:0 2px 5px #bbb;
}

.word.found{
 background:#54d5a3;
 color:white;
 text-decoration:line-through;
}

.clues{
 margin-top:15px;
 background:#fff4c4;
 padding:12px;
 border-radius:15px;
 font-size:14px;
}

button{
 width:100%;
 border:0;
 padding:13px;
 margin-top:15px;
 border-radius:18px;
 background:linear-gradient(90deg,#ff579b,#665de7);
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

#message{
 text-align:center;
 margin-top:15px;
 padding:12px;
 border-radius:15px;
 background:#e4ffec;
 font-weight:bold;
 display:none;
}

#final{
 position:fixed;
 inset:0;
 background:#302b64dd;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:20;
}

.finalBox{
 background:white;
 max-width:450px;
 width:100%;
 padding:30px;
 border-radius:30px;
 text-align:center;
 box-shadow:0 20px 60px #0005;
}

.finalEmoji{font-size:65px}

.finalBox h2{
 color:#6258d7;
 font-size:34px;
 margin:5px;
}

.finalScore{
 font-size:21px;
 line-height:1.6;
}

.secret{
 background:#fff0a8;
 padding:15px;
 border-radius:18px;
 margin-top:15px;
 font-size:20px;
 font-weight:bold;
}

@media(max-width:700px){
 .container{padding:13px}
 .game{display:block}
 .panel{margin-top:18px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .cell{font-size:clamp(11px,4vw,18px)}
}
</style>
</head>

<body>

<div class="container">

<header>
 <div class="badge">🎮 DESAFÍO ESCOLAR</div>
 <h1>🌈 MISIÓN 6.º</h1>
 <div class="subtitle">
   ¿Podés superar los 3 niveles?
 </div>
</header>

<div class="stats">

 <div class="stat points">
   ⭐ PUNTOS
   <b id="points">0</b>
 </div>

 <div class="stat time">
   ⏱️ TIEMPO
   <b id="time">120</b>
 </div>

 <div class="stat lives">
   ❤️ VIDAS
   <b id="lives">3</b>
 </div>

 <div class="stat level">
   🚀 NIVEL
   <b id="level">1</b>
 </div>

</div>

<div class="game">

<div>

 <div class="board">
   <div id="grid"></div>
 </div>

 <div id="message"></div>

</div>

<div class="panel">

 <div class="levelTitle" id="levelTitle">
   🔎 NIVEL 1
 </div>

 <h2>🎯 Encontrá:</h2>

 <div class="words" id="words"></div>

 <div class="clues" id="clues">
   💡 <b>Cómo jugar:</b><br><br>
   Tocá la primera letra y después la última letra de una palabra.
   Puede estar horizontal, vertical o diagonal.
 </div>

 <button onclick="restart()">🔄 NUEVO JUEGO</button>

</div>

</div>

</div>

<div id="final">

 <div class="finalBox">

   <div class="finalEmoji" id="finalEmoji">🏆</div>

   <h2 id="finalTitle">¡MISIÓN CUMPLIDA!</h2>

   <div class="finalScore" id="finalScore"></div>

   <div class="secret" id="secret"></div>

   <button onclick="restart()">🎮 JUGAR DE NUEVO</button>

 </div>

</div>

<script>

/* =====================================================
   TABLERO
===================================================== */

const TAMANO = 12;

const niveles = [

/* =====================================================
   NIVEL 1
===================================================== */

{
 titulo:"🔎 NIVEL 1 — CALENTAMIENTO",

 palabras:[
  ["PLANETA",0,0,0,6],
  ["ESCUELA",2,1,2,7],
  ["AMISTAD",5,0,5,6],
  ["CIENCIA",8,1,8,7]
 ],

 pistas:[]
},


/* =====================================================
   NIVEL 2
===================================================== */

{
 titulo:"🔥 NIVEL 2 — MÁS DIFÍCIL",

 palabras:[
  ["NATURALEZA",8,9,8,0],
  ["AVENTURA",8,0,1,7],
  ["ANIMALES",9,9,2,9],
  ["LECTURA",5,7,11,7],
  ["PLANETA",5,6,5,0],
  ["CIENCIA",4,10,10,10]
 ],

 pistas:[]
},


/* =====================================================
   NIVEL 3
===================================================== */

{
 titulo:"😈 NIVEL 3 — DESAFÍO FINAL",

 palabras:[
  ["MISTERIO",9,8,9,1],
  ["AVENTURA",6,2,6,9],
  ["FAMILIA",2,10,2,4],
  ["DESAFIO",1,1,7,1],
  ["PLANETA",7,11,7,5],
  ["MUSICA",6,0,11,0],
  ["FUTURO",3,8,3,3],
  ["AMIGOS",5,3,5,8],
  ["EQUIPO",5,2,0,2],
  ["JUEGO",11,6,7,2]
 ],

 pistas:[]
}

];


/* =====================================================
   LETRAS PARA COMPLETAR EL TABLERO
===================================================== */

const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


/* =====================================================
   VARIABLES DEL JUEGO
===================================================== */

let tablero = [];
let nivelActual = 0;
let palabrasEncontradas = [];
let primeraCelda = null;
let puntos = 0;
let vidas = 3;
let tiempo = 120;
let jugando = true;
let temporizador;


/* =====================================================
   CREAR TABLERO
===================================================== */

function crearTablero(){

 tablero = Array.from(
  {length:TAMANO},
  ()=>Array(TAMANO).fill("")
 );

 const datos = niveles[nivelActual].palabras;


 datos.forEach(elemento => {

  const palabra = elemento[0];

  const filaInicial = elemento[1];
  const columnaInicial = elemento[2];

  const filaFinal = elemento[3];
  const columnaFinal = elemento[4];


  const direccionFila =
   Math.sign(filaFinal-filaInicial);

  const direccionColumna =
   Math.sign(columnaFinal-columnaInicial);


  for(let i=0;i<palabra.length;i++){

   const fila =
    filaInicial + direccionFila*i;

   const columna =
    columnaInicial + direccionColumna*i;


   /*
      CONTROL DE CRUCES
   */

   if(
    tablero[fila][columna] &&
    tablero[fila][columna] !== palabra[i]
   ){

    console.error(
     "ERROR DE CRUCE:",
     palabra,
     "posición",
     fila,
     columna,
     "esperaba",
     palabra[i],
     "pero ya existe",
     tablero[fila][columna]
    );

   }


   tablero[fila][columna] =
    palabra[i];

  }

 });


 /* =================================================
    COMPLETAR ESPACIOS VACÍOS
 ================================================= */

 for(let fila=0;fila<TAMANO;fila++){

  for(let columna=0;columna<TAMANO;columna++){

   if(!tablero[fila][columna]){

    tablero[fila][columna] =
     letras[
      Math.floor(
       Math.random()*letras.length
      )
     ];

   }

  }

 }

}


/* =====================================================
   DIBUJAR TABLERO
===================================================== */

function dibujarTablero(){

 const cuadricula =
  document.getElementById("grid");

 cuadricula.innerHTML = "";


 for(let fila=0;fila<TAMANO;fila++){

  for(let columna=0;columna<TAMANO;columna++){

   const celda =
    document.createElement("div");


   celda.className = "cell";


   celda.textContent =
    tablero[fila][columna];


   celda.dataset.fila = fila;
   celda.dataset.columna = columna;


   celda.onclick = () =>
    seleccionarCelda(celda);


   cuadricula.appendChild(celda);

  }

 }

}


/* =====================================================
   LISTA DE PALABRAS
===================================================== */

function dibujarPalabras(){

 const contenedor =
  document.getElementById("words");

 contenedor.innerHTML = "";


 niveles[nivelActual].palabras.forEach(
  elemento => {

   const palabra =
    document.createElement("div");


   palabra.className = "word";


   palabra.id =
    "word-" + elemento[0];


   palabra.textContent =
    elemento[0];


   contenedor.appendChild(palabra);

  }
 );

}


/* =====================================================
   SELECCIONAR CELDA
===================================================== */

function seleccionarCelda(celda){

 if(!jugando) return;


 const fila =
  Number(celda.dataset.fila);

 const columna =
  Number(celda.dataset.columna);


 /* =================================================
    PRIMERA LETRA
 ================================================= */

 if(!primeraCelda){

  primeraCelda = {
   fila:fila,
   columna:columna
  };


  celda.classList.add("selected");

  return;

 }


 /* =================================================
    SEGUNDA LETRA
 ================================================= */

 const segundaCelda = {
  fila:fila,
  columna:columna
 };


 const palabra =
  obtenerPalabra(
   primeraCelda,
   segundaCelda
  );


 limpiarSeleccion();


 /* =================================================
    NO FORMA UNA PALABRA
 ================================================= */

 if(!palabra){

  vidas--;


  document.getElementById("lives")
   .textContent = vidas;


  mostrarMensaje(
   "❌ Esa combinación no forma una palabra."
  );


  if(vidas <= 0){

   finalizar(false);

  }


  primeraCelda = null;

  return;

 }


 /* =================================================
    PALABRA YA ENCONTRADA
 ================================================= */

 if(
  palabrasEncontradas.includes(palabra)
 ){

  mostrarMensaje(
   "👀 Esa palabra ya estaba encontrada."
  );


  primeraCelda = null;

  return;

 }


 /* =================================================
    PALABRA ENCONTRADA
 ================================================= */

 palabrasEncontradas.push(palabra);


 marcarPalabra(
  primeraCelda,
  segundaCelda
 );


 document
  .getElementById("word-"+palabra)
  .classList.add("found");


 puntos += 150;


 document.getElementById("points")
  .textContent = puntos;


 mostrarMensaje(
  "🎉 ¡Encontraste "+palabra+"!"
 );


 primeraCelda = null;


 /* =================================================
    PASAR AL SIGUIENTE NIVEL
 ================================================= */

 if(
  palabrasEncontradas.length ===
  niveles[nivelActual].palabras.length
 ){

  if(nivelActual < niveles.length-1){

   setTimeout(() => {

    nivelActual++;

    palabrasEncontradas = [];

    primeraCelda = null;


    document.getElementById("level")
     .textContent =
      nivelActual+1;


    document.getElementById("levelTitle")
     .textContent =
      niveles[nivelActual].titulo;


    crearTablero();

    dibujarTablero();

    dibujarPalabras();


    mostrarMensaje(
     "🚀 ¡NIVEL SUPERADO! Ahora viene uno más difícil."
    );


   },800);


  }else{

   setTimeout(
    ()=>finalizar(true),
    800
   );

  }

 }

}


/* =====================================================
   OBTENER PALABRA ENTRE DOS PUNTOS
===================================================== */

function obtenerPalabra(a,b){

 const diferenciaFila =
  b.fila-a.fila;


 const diferenciaColumna =
  b.columna-a.columna;


 /* =================================================
    HORIZONTAL, VERTICAL O DIAGONAL
 ================================================= */

 if(
  diferenciaFila !== 0 &&
  diferenciaColumna !== 0 &&
  Math.abs(diferenciaFila) !==
   Math.abs(diferenciaColumna)
 ){

  return null;

 }


 const pasos =
  Math.max(
   Math.abs(diferenciaFila),
   Math.abs(diferenciaColumna)
  );


 if(pasos < 1){

  return null;

 }


 const direccionFila =
  diferenciaFila === 0
   ? 0
   : diferenciaFila/pasos;


 const direccionColumna =
  diferenciaColumna === 0
   ? 0
   : diferenciaColumna/pasos;


 let texto = "";


 for(let i=0;i<=pasos;i++){

  const fila =
   a.fila + direccionFila*i;


  const columna =
   a.columna + direccionColumna*i;


  texto +=
   tablero[fila][columna];

 }


 /* =================================================
    COMPROBAR LAS PALABRAS
 ================================================= */

 for(
  const elemento
  of niveles[nivelActual].palabras
 ){

  const palabraObjetivo =
   elemento[0];


  /* Dirección normal */

  if(texto === palabraObjetivo){

   return palabraObjetivo;

  }


  /* Dirección inversa */

  if(
   texto
    .split("")
    .reverse()
    .join("") === palabraObjetivo
  ){

   return palabraObjetivo;

  }

 }


 return null;

}


/* =====================================================
   MARCAR PALABRA ENCONTRADA
===================================================== */

function marcarPalabra(a,b){

 const diferenciaFila =
  b.fila-a.fila;


 const diferenciaColumna =
  b.columna-a.columna;


 const pasos =
  Math.max(
   Math.abs(diferenciaFila),
   Math.abs(diferenciaColumna)
  );


 const direccionFila =
  diferenciaFila === 0
   ? 0
   : diferenciaFila/pasos;


 const direccionColumna =
  diferenciaColumna === 0
   ? 0
   : diferenciaColumna/pasos;


 for(let i=0;i<=pasos;i++){

  const fila =
   a.fila + direccionFila*i;


  const columna =
   a.columna + direccionColumna*i;


  const celda =
   document.querySelector(
    `.cell[data-fila="${fila}"][data-columna="${columna}"]`
   );


  if(celda){

   celda.classList.add("found");

  }

 }

}


/* =====================================================
   LIMPIAR SELECCIÓN
===================================================== */

function limpiarSeleccion(){

 document
  .querySelectorAll(".cell.selected")
  .forEach(
   celda =>
    celda.classList.remove("selected")
  );

}


/* =====================================================
   MOSTRAR MENSAJES
===================================================== */

function mostrarMensaje(texto){

 const caja =
  document.getElementById("message");


 caja.innerHTML = texto;


 caja.style.display = "block";


 setTimeout(() => {

  caja.style.display = "none";

 },1500);

}


/* =====================================================
   CRONÓMETRO
===================================================== */

function iniciarTemporizador(){

 clearInterval(temporizador);


 temporizador = setInterval(() => {

  if(!jugando) return;


  tiempo--;


  document.getElementById("time")
   .textContent = tiempo;


  if(tiempo <= 0){

   finalizar(false);

  }

 },1000);

}


/* =====================================================
   FINAL DEL JUEGO
===================================================== */

function finalizar(gano){

 jugando = false;


 clearInterval(temporizador);


 const ventanaFinal =
  document.getElementById("final");


 ventanaFinal.style.display = "flex";


 /* =================================================
    GANÓ
 ================================================= */

 if(gano){

  document.getElementById("finalEmoji")
   .textContent = "🏆";


  document.getElementById("finalTitle")
   .textContent =
    "¡MISIÓN CUMPLIDA!";


  document.getElementById("finalScore")
   .innerHTML =
    "🎉 ¡Superaste los 3 niveles!<br><br>"+
    "⭐ Puntaje final: <b>"+
    puntos+
    "</b><br>"+
    "⏱️ Tiempo restante: <b>"+
    tiempo+
    " segundos</b>";


  document.getElementById("secret")
   .innerHTML =
    "🔐 PALABRA SECRETA<br><br>"+
    "🌟 ¡CAMPEÓN/A DEL DESAFÍO! 🌟";


 }else{


  /* =================================================
     PERDIÓ
 ================================================= */

  document.getElementById("finalEmoji")
   .textContent = "😅";


  document.getElementById("finalTitle")
   .textContent =
    "¡CASI LO LOGRÁS!";


  document.getElementById("finalScore")
   .innerHTML =
    "Llegaste hasta el <b>Nivel "+
    (nivelActual+1)+
    "</b>.<br><br>"+
    "⭐ Puntaje: <b>"+
    puntos+
    "</b>";


  document.getElementById("secret")
   .innerHTML =
    "💪 ¡Intentá nuevamente!";

 }

}


/* =====================================================
   REINICIAR JUEGO
===================================================== */

function reiniciar(){

 clearInterval(temporizador);


 nivelActual = 0;

 palabrasEncontradas = [];

 primeraCelda = null;

 puntos = 0;

 vidas = 3;

 tiempo = 120;

 jugando = true;


 document.getElementById("points")
  .textContent = 0;


 document.getElementById("lives")
  .textContent = 3;


 document.getElementById("time")
  .textContent = 120;


 document.getElementById("level")
  .textContent = 1;


 document.getElementById("final")
  .style.display = "none";


 document.getElementById("levelTitle")
  .textContent =
   niveles[0].titulo;


 crearTablero();

 dibujarTablero();

 dibujarPalabras();

 iniciarTemporizador();

}


/* =====================================================
   INICIAR JUEGO
===================================================== */

reiniciar();

</script>

</body>
</html>
