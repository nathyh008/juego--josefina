<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafío - Sopa de Letras</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #dff6ff, #fff3d6);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.contenedor {
  width: 100%;
  max-width: 650px;
  background: white;
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 8px 25px rgba(0,0,0,.15);
  text-align: center;
}

h1 {
  margin: 5px 0;
  color: #4056a1;
  font-size: 30px;
}

.subtitulo {
  color: #555;
  margin-bottom: 15px;
}

.contador {
  font-size: 20px;
  font-weight: bold;
  color: #e76f51;
  margin-bottom: 15px;
}

#sopa {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 3px;
  max-width: 500px;
  margin: auto;
  user-select: none;
}

.letra {
  aspect-ratio: 1;
  background: #f1f5ff;
  border: 1px solid #ccd5ee;
  border-radius: 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(14px, 4vw, 23px);
  font-weight: bold;
  cursor: pointer;
  transition: .15s;
}

.letra.seleccionada {
  background: #ffd166;
  color: #333;
}

.letra.encontrada {
  background: #70c1b3;
  color: white;
}

.palabras {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.palabra {
  background: #f1f1f1;
  padding: 7px 12px;
  border-radius: 15px;
  font-weight: bold;
  font-size: 14px;
}

.palabra.encontrada {
  background: #70c1b3;
  color: white;
  text-decoration: line-through;
}

#mensaje {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 15px;
  background: #fff3cd;
  color: #765900;
  font-size: 22px;
  font-weight: bold;
}

button {
  margin-top: 15px;
  padding: 12px 22px;
  border: none;
  border-radius: 20px;
  background: #4056a1;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.instruccion {
  font-size: 15px;
  color: #666;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>🔎 DESAFÍO: SOPA DE LETRAS</h1>

<p class="subtitulo">
¡Encontrá las 10 palabras escondidas!
</p>

<p class="instruccion">
Tocá las letras que forman una palabra.
</p>

<div class="contador">
Encontradas: <span id="cantidad">0</span> / 10
</div>

<div id="sopa"></div>

<div class="palabras" id="palabras"></div>

<div id="mensaje">
🎉 ¡FELICITACIONES! 🎉<br>
Encontraste todas las palabras.
</div>

<button onclick="location.reload()">🔄 Jugar nuevamente</button>

</div>

<script>

const palabras = [
"PLANETA",
"ESCUELA",
"AMISTAD",
"CIENCIA",
"LIBRO",
"NATURALEZA",
"MUSICA",
"ANIMAL",
"FAMILIA",
"JUEGO"
];

const filas = [
"PLANETAQWE",
"RTYESCUELA",
"AMISTADZXCV",
"QCIENCIAASD",
"LIBROFGHJK",
"NATURALEZA",
"MUSICAZXCVB",
"ANIMALQWERT",
"FAMILIAASDF",
"JUEGOPLKJH"
];

let seleccion = [];
let encontradas = [];

const sopa = document.getElementById("sopa");
const lista = document.getElementById("palabras");
const cantidad = document.getElementById("cantidad");
const mensaje = document.getElementById("mensaje");

palabras.forEach(p => {
  const div = document.createElement("div");
  div.className = "palabra";
  div.id = "palabra-" + p;
  div.textContent = p;
  lista.appendChild(div);
});

let tablero = [];

filas.forEach((fila, i) => {
  tablero[i] = fila.split("");
});

for(let f=0; f<10; f++){
  for(let c=0; c<10; c++){

    const letra = document.createElement("div");

    letra.className = "letra";
    letra.textContent = tablero[f][c];

    letra.dataset.fila = f;
    letra.dataset.columna = c;

    letra.addEventListener("click", () => seleccionar(letra));

    sopa.appendChild(letra);
  }
}

function seleccionar(letra){

  if(letra.classList.contains("encontrada")) return;

  letra.classList.toggle("seleccionada");

  const f = letra.dataset.fila;
  const c = letra.dataset.columna;

  const indice = seleccion.findIndex(x => x.f == f && x.c == c);

  if(indice >= 0){
    seleccion.splice(indice,1);
  }else{
    seleccion.push({f,c});
  }

  comprobar();
}

function comprobar(){

  let texto = "";

  seleccion.forEach(x => {
    texto += tablero[x.f][x.c];
  });

  let textoInverso = texto.split("").reverse().join("");

  let palabraEncontrada = null;

  for(const palabra of palabras){

    if(!encontradas.includes(palabra)){

      if(texto === palabra || textoInverso === palabra){

        palabraEncontrada = palabra;
        break;
      }
    }
  }

  if(palabraEncontrada){

    encontradas.push(palabraEncontrada);

    seleccion.forEach(x => {

      const celda = document.querySelector(
        `.letra[data-fila="${x.f}"][data-columna="${x.c}"]`
      );

      celda.classList.remove("seleccionada");
      celda.classList.add("encontrada");

    });

    document
      .getElementById("palabra-" + palabraEncontrada)
      .classList.add("encontrada");

    seleccion = [];

    cantidad.textContent = encontradas.length;

    if(encontradas.length === palabras.length){

      mensaje.style.display = "block";

      setTimeout(() => {
        mensaje.scrollIntoView({behavior:"smooth"});
      },200);
    }

  }

}

</script>

</body>
</html>
</html>
