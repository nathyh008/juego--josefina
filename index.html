<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Misión 6.º</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#75d5ff,#9d8cff,#ff9fca);
 min-height:100vh;
 padding:15px;
 color:#35355c;
}

.container{
 max-width:950px;
 margin:auto;
 background:white;
 border-radius:30px;
 padding:22px;
 box-shadow:0 15px 45px #403b7a55;
}

header{text-align:center}

.badge{
 display:inline-block;
 background:linear-gradient(90deg,#ff579b,#655de8);
 color:white;
 padding:7px 18px;
 border-radius:20px;
 font-weight:bold;
}

h1{
 margin:8px 0 3px;
 font-size:clamp(34px,7vw,55px);
 background:linear-gradient(90deg,#ff4d91,#685ce8,#00aeea);
 -webkit-background-clip:text;
 color:transparent;
}

.subtitle{margin-top:5px;font-size:17px}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:20px 0;
}

.stat{
 padding:10px;
 border-radius:18px;
 text-align:center;
 font-weight:bold;
}

.stat b{
 display:block;
 font-size:25px;
 margin-top:3px;
}

.points{background:#fff0a8}
.time{background:#c7f3ff}
.lives{background:#ffd1e1}
.level{background:#d8ffd2}

.game{
 display:grid;
 grid-template-columns:minmax(0,1fr) 280px;
 gap:22px;
}

.board{
 background:#6960dc;
 padding:7px;
 border-radius:20px;
}

#grid{
 display:grid;
 grid-template-columns:repeat(12,1fr);
 gap:3px;
}

.cell{
 aspect-ratio:1;
 background:white;
 border-radius:6px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
 font-size:clamp(12px,3vw,22px);
 cursor:pointer;
 transition:.15s;
}

.cell:hover{background:#fff0a6}

.cell.selected{
 background:#ffc94f;
 transform:scale(1.05);
}

.cell.found{
 background:#54d5a3;
 color:white;
}

.panel{
 background:#f4f3ff;
 border-radius:22px;
 padding:18px;
}

.panel h2{
 margin-top:0;
 color:#5f55d6;
}

.levelTitle{
 background:#6960dc;
 color:white;
 padding:10px;
 border-radius:15px;
 text-align:center;
 font-weight:bold;
 margin-bottom:12px;
}

.words{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
}

.word{
 background:white;
 padding:6px 9px;
 border-radius:13px;
 font-size:13px;
 font-weight:bold;
 box-shadow:0 2px 5px #bbb;
}

.word.found{
 background:#54d5a3;
 color:white;
 text-decoration:line-through;
}

.clues{
 margin-top:15px;
 background:#fff4c4;
 padding:12px;
 border-radius:15px;
 font-size:14px;
}

button{
 width:100%;
 border:0;
 padding:13px;
 margin-top:15px;
 border-radius:18px;
 background:linear-gradient(90deg,#ff579b,#665de7);
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

#message{
 text-align:center;
 margin-top:15px;
 padding:12px;
 border-radius:15px;
 background:#e4ffec;
 font-weight:bold;
 display:none;
}

#final{
 position:fixed;
 inset:0;
 background:#302b64dd;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:20;
}

.finalBox{
 background:white;
 max-width:450px;
 width:100%;
 padding:30px;
 border-radius:30px;
 text-align:center;
 box-shadow:0 20px 60px #0005;
}

.finalEmoji{font-size:65px}

.finalBox h2{
 color:#6258d7;
 font-size:34px;
 margin:5px;
}

.finalScore{
 font-size:21px;
 line-height:1.6;
}

.secret{
 background:#fff0a8;
 padding:15px;
 border-radius:18px;
 margin-top:15px;
 font-size:20px;
 font-weight:bold;
}

@media(max-width:700px){
 .container{padding:13px}
 .game{display:block}
 .panel{margin-top:18px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .cell{font-size:clamp(11px,4vw,18px)}
}
</style>
</head>

<body>

<div class="container">

<header>
 <div class="badge">🎮 DESAFÍO ESCOLAR</div>
 <h1>🌈 MISIÓN 6.º</h1>
 <div class="subtitle">
   ¿Podés superar los 3 niveles?
 </div>
</header>

<div class="stats">

 <div class="stat points">
   ⭐ PUNTOS
   <b id="points">0</b>
 </div>

 <div class="stat time">
   ⏱️ TIEMPO
   <b id="time">120</b>
 </div>

 <div class="stat lives">
   ❤️ VIDAS
   <b id="lives">3</b>
 </div>

 <div class="stat level">
   🚀 NIVEL
   <b id="level">1</b>
 </div>

</div>

<div class="game">

<div>

 <div class="board">
   <div id="grid"></div>
 </div>

 <div id="message"></div>

</div>

<div class="panel">

 <div class="levelTitle" id="levelTitle">
   🔎 NIVEL 1
 </div>

 <h2>🎯 Encontrá:</h2>

 <div class="words" id="words"></div>

 <div class="clues" id="clues">
   💡 <b>Cómo jugar:</b><br><br>
   Tocá la primera letra y después la última letra de una palabra.
   Puede estar horizontal, vertical o diagonal.
 </div>

 <button onclick="restart()">🔄 NUEVO JUEGO</button>

</div>

</div>

</div>

<div id="final">

 <div class="finalBox">

   <div class="finalEmoji" id="finalEmoji">🏆</div>

   <h2 id="finalTitle">¡MISIÓN CUMPLIDA!</h2>

   <div class="finalScore" id="finalScore"></div>

   <div class="secret" id="secret"></div>

   <button onclick="restart()">🎮 JUGAR DE NUEVO</button>

 </div>

</div>

<script>

/* =====================================================
   TABLERO FIJO
   Esto hace que el juego cargue rápido y nunca quede
   atrapado generando palabras.
===================================================== */

const SIZE=12;

const levels=[

{
 title:"🔎 NIVEL 1 — CALENTAMIENTO",
 words:[
  ["PLANETA",0,0,0,6],
  ["ESCUELA",2,1,2,7],
  ["AMISTAD",5,0,5,6],
  ["CIENCIA",8,1,8,7]
 ],
 clues:[]
},

{
 title:"🔥 NIVEL 2 — MÁS DIFÍCIL",
 words:[
  ["NATURALEZA",1,10,10,1],
  ["AVENTURA",3,0,10,7],
  ["ANIMALES",11,0,4,7],
  ["LECTURA",0,11,6,5]
 ],
 clues:[]
},

{
 title:"🔥 NIVEL 2 — MÁS DIFÍCIL",
 words:[
  ["NATURALEZA",1,1,1,10],
  ["AVENTURA",3,0,10,7],
  ["ANIMALES",11,0,4,0],
  ["LECTURA",0,11,6,5]
 ],
 clues:[]
},

];

/* Letras de relleno */
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

/* Variables */
let board=[];
let currentLevel=0;
let found=[];
let firstCell=null;
let points=0;
let lives=3;
let time=120;
let playing=true;
let timer;

/* Crear tablero */

function createBoard(){

 board=Array.from(
  {length:SIZE},
  ()=>Array(SIZE).fill("")
 );

 const data=levels[currentLevel].words;

 data.forEach(item=>{

  const word=item[0];
  const r1=item[1];
  const c1=item[2];
  const r2=item[3];
  const c2=item[4];

  const dr=Math.sign(r2-r1);
  const dc=Math.sign(c2-c1);

  for(let i=0;i<word.length;i++){

   const r=r1+dr*i;
   const c=c1+dc*i;

   board[r][c]=word[i];

  }

 });

 /* Completar espacios vacíos */

 for(let r=0;r<SIZE;r++){

  for(let c=0;c<SIZE;c++){

   if(!board[r][c]){
    board[r][c]=letters[
     Math.floor(Math.random()*letters.length)
    ];
   }

  }

 }

}

/* Dibujar */

function draw(){

 const grid=document.getElementById("grid");

 grid.innerHTML="";

 for(let r=0;r<SIZE;r++){

  for(let c=0;c<SIZE;c++){

   const cell=document.createElement("div");

   cell.className="cell";
   cell.textContent=board[r][c];

   cell.dataset.r=r;
   cell.dataset.c=c;

   cell.onclick=()=>selectCell(cell);

   grid.appendChild(cell);

  }

 }

}

/* Lista de palabras */

function drawWords(){

 const container=document.getElementById("words");

 container.innerHTML="";

 levels[currentLevel].words.forEach(item=>{

  const div=document.createElement("div");

  div.className="word";
  div.id="word-"+item[0];

  div.textContent=item[0];

  container.appendChild(div);

 });

}

/* Selección */

function selectCell(cell){

 if(!playing)return;

 const r=Number(cell.dataset.r);
 const c=Number(cell.dataset.c);

 /* Primera letra */

 if(!firstCell){

  firstCell={r,c};

  cell.classList.add("selected");

  return;

 }

 /* Segunda letra */

 const second={r,c};

 const word=getWord(firstCell,second);

 clearSelection();

 if(!word){

  lives--;

  document.getElementById("lives").textContent=lives;

  showMessage("❌ Esa combinación no forma una palabra.");

  if(lives<=0){
   finish(false);
  }

  firstCell=null;

  return;

 }

 if(found.includes(word)){

  showMessage("👀 Esa palabra ya estaba encontrada.");

  firstCell=null;

  return;

 }

 found.push(word);

 markWord(firstCell,second);

 document.getElementById("word-"+word)
   .classList.add("found");

 points+=150;

 document.getElementById("points").textContent=points;

 showMessage("🎉 ¡Encontraste "+word+"!");

 firstCell=null;

 /* Pasar de nivel */

 if(found.length===levels[currentLevel].words.length){

  if(currentLevel<levels.length-1){

   setTimeout(()=>{

    currentLevel++;

    found=[];
    firstCell=null;

    document.getElementById("level").textContent=
      currentLevel+1;

    document.getElementById("levelTitle").textContent=
      levels[currentLevel].title;

    createBoard();
    draw();
    drawWords();

    showMessage("🚀 ¡NIVEL SUPERADO! Ahora viene uno más difícil.");

   },800);

  }else{

   setTimeout(()=>finish(true),800);

  }

 }

}

/* Obtener palabra entre dos puntos */

function getWord(a,b){

 const dr=b.r-a.r;
 const dc=b.c-a.c;

 /* Solo horizontal, vertical o diagonal */

 if(
  dr!==0 &&
  dc!==0 &&
  Math.abs(dr)!==Math.abs(dc)
 ){
  return null;
 }

 const steps=Math.max(
  Math.abs(dr),
  Math.abs(dc)
 );

 if(steps<1)return null;

 const sr=dr===0?0:dr/steps;
 const sc=dc===0?0:dc/steps;

 let text="";

 for(let i=0;i<=steps;i++){

  const r=a.r+sr*i;
  const c=a.c+sc*i;

  text+=board[r][c];

 }

 /* Comprobar palabra normal */

 for(const item of levels[currentLevel].words){

  if(text===item[0]){
   return item[0];
  }

  if(
   text.split("").reverse().join("")===item[0]
  ){
   return item[0];
  }

 }

 return null;

}

/* Marcar */

function markWord(a,b){

 const dr=b.r-a.r;
 const dc=b.c-a.c;

 const steps=Math.max(
  Math.abs(dr),
  Math.abs(dc)
 );

 const sr=dr===0?0:dr/steps;
 const sc=dc===0?0:dc/steps;

 for(let i=0;i<=steps;i++){

  const r=a.r+sr*i;
  const c=a.c+sc*i;

  const cell=document.querySelector(
   `.cell[data-r="${r}"][data-c="${c}"]`
  );

  if(cell)cell.classList.add("found");

 }

}

/* Limpiar selección */

function clearSelection(){

 document
 .querySelectorAll(".cell.selected")
 .forEach(c=>c.classList.remove("selected"));

}

/* Mensaje */

function showMessage(text){

 const box=document.getElementById("message");

 box.innerHTML=text;
 box.style.display="block";

 setTimeout(()=>{
  box.style.display="none";
 },1500);

}

/* Cronómetro */

function startTimer(){

 clearInterval(timer);

 timer=setInterval(()=>{

  if(!playing)return;

  time--;

  document.getElementById("time").textContent=time;

  if(time<=0){
   finish(false);
  }

 },1000);

}

/* Final */

function finish(win){

 playing=false;

 clearInterval(timer);

 const modal=document.getElementById("final");

 modal.style.display="flex";

 if(win){

  document.getElementById("finalEmoji").textContent="🏆";

  document.getElementById("finalTitle").textContent=
   "¡MISIÓN CUMPLIDA!";

  document.getElementById("finalScore").innerHTML=
   "🎉 ¡Superaste los 3 niveles!<br><br>"+
   "⭐ Puntaje final: <b>"+points+"</b><br>"+
   "⏱️ Tiempo restante: <b>"+time+" segundos</b>";

  document.getElementById("secret").innerHTML=
   "🔐 PALABRA SECRETA<br><br>"+
   "🌟 ¡CAMPEÓN/A DEL DESAFÍO! 🌟";

 }else{

  document.getElementById("finalEmoji").textContent="😅";

  document.getElementById("finalTitle").textContent=
   "¡CASI LO LOGRÁS!";

  document.getElementById("finalScore").innerHTML=
   "Llegaste hasta el <b>Nivel "+(currentLevel+1)+"</b>.<br><br>"+
   "⭐ Puntaje: <b>"+points+"</b>";

  document.getElementById("secret").innerHTML=
   "💪 ¡Intentá nuevamente!";

 }

}

/* Reiniciar */

function restart(){

 clearInterval(timer);

 currentLevel=0;
 found=[];
 firstCell=null;
 points=0;
 lives=3;
 time=120;
 playing=true;

 document.getElementById("points").textContent=0;
 document.getElementById("lives").textContent=3;
 document.getElementById("time").textContent=120;
 document.getElementById("level").textContent=1;

 document.getElementById("final").style.display="none";

 document.getElementById("levelTitle").textContent=
  levels[0].title;

 createBoard();
 draw();
 drawWords();
 startTimer();

}

restart();

</script>

</body>
</html>
